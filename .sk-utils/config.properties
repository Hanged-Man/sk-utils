# sk-utils configuration — the live copy of this file is ~/.sk-utils/config.properties
# (build.ps1 copies the root template there on first build; the mod also seeds one at
# first run if it is missing).

# main_account: the KNIGHT (character) name of your main/controlling account.
# Read once at game launch — change it, then restart the clients (no rebuild).
main_account=

# party_size: total multibox accounts (main + alts). The mission cycle waits for
# this many knights on every floor before starting it. Default 4.
#party_size=4

# udp_base_port: first port of the mod's local (127.0.0.1) control plane — the
# main listens here, alts take the next 20. multibox.py reads this file too, so
# both sides stay in step. Change only on a port conflict. Default 40000.
#udp_base_port=40000

# install_dir: which game install build.ps1 patches against. Leave unset to
# auto-detect (LOCALAPPDATA launcher install first, then Steam libraries).
# Build-time only - the mod itself never reads it.
#install_dir=C:\Users\You\AppData\Local\Spiral Knights\app

# auto-relog: while a full-auto mode (Ctrl+R / Ctrl+Q) is armed, a disconnected
# alt logs back in using these two keys. relog_alts is a comma-separated list of
# account:knight pairs — knight is the CHARACTER that account should log back
# into. relog_password is the alts' shared login password, stored in PLAINTEXT —
# keep this file private. Both are re-read live (no restart needed).
relog_alts=
relog_password=
